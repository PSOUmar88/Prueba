  <body>

    <script>

        const num1 = document.getElementById("num1");

        let miNumero = 10;

        num1.innerHTML = `${miNumero} se corresponde con el tipo ${typeof miNumero}`;

        const num2 = document.getElementById("num2");

         num2.innerHTML = `${-miNumero} se corresponde con el tipo ${typeof miNumero}`;

        const num3 = document.getElementById("num3");

        num3.innerHTML = `${miNumero} se corresponde con el tipo ${typeof miNumero}`;

        const num4 = document.getElementById("num4");

        let decimal = 10.5;

        num4.innerHTML = `${-decimal} se corresponde con el tipo ${typeof miNumero}`;

        const octal = document.getElementById("dec1");

        const hexa = document.getElementById("dec3");

        let hexadec = 0x3fe21;

        hexa.innerHTML = ` 0x${hexadec.toString(16)} es en decimal ${hexadec} y se corresponde con el tipo ${typeof hexadec}`;

        let infin = Infinity;

        infi.innerHTML = `${infin} se corresponde con el tipo ${typeof infin}`;

        const boolean = document.getElementById("boolean");

        let bool = true;

        let indef;

        null1.innerHTML = `${nul} se corresponde con el tipo ${typeof nul}`;

        const bigint = document.getElementById("bigint");

        let big = 9007199254740991n;

        bigint.innerHTML = `${big} se corresponde con el tipo ${typeof big}`;

<!DOCTYPE html>

<html lang="es">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>002: Variables y constantes</title>

    <style>

      p {
        padding: 20px 10px;
        background-color: #eee;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      
    </style>

  </head>

  <body>

    <h1>002: Variables y constantes</h1>

    <h2 id="titulo-2"></h2>

    <h3 id="titulo-3"></h3>

    <p id="parrafo"></p>

    <script>
      
      document.getElementById("titulo-2").innerHTML = "Esto es el título 2";

      const titulo2 = document.getElementById("titulo-3");
      
      titulo2.innerHTML = "Esto es el título 3";

      parrafo.innerHTML = "Esto es el párrafo";

    </script>

  </body>

</html>
